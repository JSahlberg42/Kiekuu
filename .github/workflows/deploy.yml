name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      
      - name: Check for functions/rules changes
        id: paths
        uses: dorny/paths-filter@v3
        with:
          filters: |
            functions:
              - 'firebase/functions/**'
            rules:
              - 'firestore.rules'
              - 'firestore.indexes.json'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Typecheck
        run: npm run typecheck
      
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_RECAPTCHA_ENTERPRISE_KEY: ${{ secrets.VITE_RECAPTCHA_ENTERPRISE_KEY }}
      
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KIEKUU }}
          projectId: kiekuu-cb601
          target: kiekuu-cb601
          channelId: live

      # Deploy Cloud Functions only when firebase/functions changed.
      - name: Deploy Cloud Functions
        if: steps.paths.outputs.functions == 'true'
        uses: w9jds/firebase-action@v15.19.1
        with:
          args: deploy --only functions --project kiekuu-cb601
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KIEKUU }}

      # Deploy Firestore rules/indexes only when they changed.
      - name: Deploy Firestore Rules
        if: steps.paths.outputs.rules == 'true'
        uses: w9jds/firebase-action@v15.19.1
        with:
          args: deploy --only firestore:rules,firestore:indexes --project kiekuu-cb601
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KIEKUU }}