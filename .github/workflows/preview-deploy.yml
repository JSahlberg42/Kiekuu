name: Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v7
      
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      
      - name: Check for functions/rules changes
        id: paths
        uses: dorny/paths-filter@v3
        with:
          filters: |
            functions:
              - 'firebase/functions/**'
            rules:
              - 'firestore.rules'
              - 'firestore.indexes.json'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Typecheck
        run: npm run typecheck
      
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_RECAPTCHA_ENTERPRISE_KEY: ${{ secrets.VITE_RECAPTCHA_ENTERPRISE_KEY }}
          VITE_DIAGNOSTICS_ENABLED: 'true'
      
      - name: Deploy to Firebase Preview
        if: github.actor != 'dependabot[bot]'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KIEKUU }}
          projectId: kiekuu-cb601
          target: test-kiekuu
          channelId: live

      # Deploy Cloud Functions only when firebase/functions changed.
      # Note: functions deploy to the single production project (kiekuu-cb601),
      # so the staging UI can test the new backend.
      - name: Deploy Cloud Functions
        if: github.actor != 'dependabot[bot]' && steps.paths.outputs.functions == 'true'
        uses: w9jds/firebase-action@v15.19.1
        with:
          args: deploy --only functions --project kiekuu-cb601
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KIEKUU }}

      # Deploy Firestore rules/indexes only when they changed.
      - name: Deploy Firestore Rules
        if: github.actor != 'dependabot[bot]' && steps.paths.outputs.rules == 'true'
        uses: w9jds/firebase-action@v15.19.1
        with:
          args: deploy --only firestore:rules,firestore:indexes --project kiekuu-cb601
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KIEKUU }}
      
      - name: Comment PR with Preview URL
        if: github.actor != 'dependabot[bot]' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 **Preview Deploy Complete!**\n\n✅ Your changes have been deployed to the testing site and are ready for review.\n\n📱 **Test Site:** https://test-kiekuu.web.app\n\n**Channel:** `' + context.ref.replace('refs/heads/', '') + '`\n\nPlease test your changes and let us know if everything looks good!'
            })
